<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IScout - Cadastro de Jogador</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../styles/variables.css">
    <link rel="stylesheet" href="../styles/reset.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../styles/cadastro-jogador.css">
    <!-- Toastify CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <div class="header-left">
                    <div class="logo-small">⚽</div>
                    <h1>IScout</h1>
                </div>

                <nav class="header-nav">
                    <a href="./dashboard.html" class="nav-link">Dashboard</a>
                    <a href="./jogadores.html" class="nav-link">Jogadores</a>
                    <a href="./historico.html" class="nav-link">Historico</a>
                    <a href="./evolucao.html" class="nav-link">Evolução</a>
                    <a href="./relatorios.html" class="nav-link">Relatórios</a>
                    <a href="./cadastro-jogador.html" class="nav-link active">Cadastrar</a>
                    <a href="./estatisticas.html" class="nav-link">Estatísticas</a>
                    <a href="./usuarios.html" class="nav-link">Usuários</a>
                </nav>

                <div class="header-right">
                    <span class="user-name" id="userName">Usuário</span>
                    <button class="btn-secondary btn-sm" id="logoutBtn">Sair</button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="content-wrapper">
                <div class="page-header">
                    <h2>Cadastro de Jogador</h2>
                    <p class="page-subtitle">Preencha os dados do jovem jogador</p>
                </div>

                <div class="success-message" id="successMessage">
                    Jogador cadastrado com sucesso!
                </div>

                <div class="error-message" id="errorMessage">
                    Erro ao cadastrar jogador. Tente novamente.
                </div>

                <form id="playerForm" class="player-form">
                    <!-- Dados Pessoais -->
                    <section class="form-section">
                        <h3 class="section-title">Dados do Jogador</h3>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="nomeCompleto">Nome Completo *</label>
                                <input
                                    type="text"
                                    id="nomeCompleto"
                                    class="form-control"
                                    placeholder="Nome completo do jogador"
                                    required
                                >
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="dataNascimento">Data de Nascimento *</label>
                                <input
                                    type="date"
                                    id="dataNascimento"
                                    class="form-control"
                                    required
                                >
                            </div>
                        </div>
                    </section>

                    <!-- Dados Técnicos -->
                    <section class="form-section">
                        <h3 class="section-title">Dados Técnicos</h3>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="teamId">Time *</label>
                                <select id="teamId" class="form-control" required>
                                    <option value="">Carregando times...</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="posicao">Posição Principal *</label>
                                <select id="posicao" class="form-control" required>
                                    <option value="">Selecione...</option>
                                    <option value="Goleiro">Goleiro</option>
                                    <option value="Zagueiro">Zagueiro</option>
                                    <option value="Lateral-Direito">Lateral Direito</option>
                                    <option value="Lateral-Esquerdo">Lateral Esquerdo</option>
                                    <option value="Volante">Volante</option>
                                    <option value="Meia">Meia</option>
                                    <option value="Meia-Atacante">Meia-Atacante</option>
                                    <option value="Ponta-Direita">Ponta Direita</option>
                                    <option value="Ponta-Esquerda">Ponta Esquerda</option>
                                    <option value="Centroavante">Centroavante</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="numeroCamisa">Número da Camisa *</label>
                                <input
                                    type="number"
                                    id="numeroCamisa"
                                    class="form-control"
                                    placeholder="10"
                                    min="1"
                                    max="99"
                                    required
                                >
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="observacoes">Observações</label>
                            <textarea 
                                id="observacoes" 
                                class="form-control" 
                                rows="4"
                                placeholder="Observações adicionais sobre o jogador..."
                            ></textarea>
                        </div>
                    </section>

                    <div class="form-actions">
                        <button type="button" class="btn-secondary" id="cancelBtn">Cancelar</button>
                        <button type="submit" class="btn">Cadastrar Jogador</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Toastify JS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="cadastro-jogador.js"></script>
</body>
</html>
