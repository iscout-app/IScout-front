<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IScout - Login</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo">⚽</div>
            <h1 class="logo-title">IScout</h1>
            <p class="logo-subtitle">Sistema de Scout de Jovens Jogadores</p>
        </div>

        <div class="login-card">
            <div class="login-header">
                <h2>Bem-vindo</h2>
                <p>Entre com suas credenciais para acessar o sistema</p>
            </div>

            <div class="error-message" id="errorMessage">
                Credenciais inválidas. Por favor, tente novamente.
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">E-mail</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-control" 
                        placeholder="seu@email.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Senha</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-control" 
                        placeholder="Digite sua senha"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <div class="divider">
                    <span>Tipo de usuário</span>
                </div>

                <div class="user-type-selector">
                    <div class="user-type-btn active" data-type="tecnico">
                        <input type="radio" name="userType" id="tecnico" value="tecnico" checked>
                        <label for="tecnico">Técnico</label>
                    </div>
                    <div class="user-type-btn" data-type="olheiro">
                        <input type="radio" name="userType" id="olheiro" value="olheiro">
                        <label for="olheiro">Olheiro</label>
                    </div>
                    <div class="user-type-btn" data-type="responsavel">
                        <input type="radio" name="userType" id="responsavel" value="responsavel">
                        <label for="responsavel">Responsável</label>
                    </div>
                    <div class="user-type-btn" data-type="admin">
                        <input type="radio" name="userType" id="admin" value="admin">
                        <label for="admin">Administrador</label>
                    </div>
                </div>

                <div class="form-options">
                    <div class="checkbox-group">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe">Lembrar-me</label>
                    </div>
                    <a href="#" class="forgot-password">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn">Entrar</button>
            </form>

            <p class="footer-text">
                Escola Oficial do Flamengo - Arapiraca
            </p>
        </div>
    </div>

    <script type="module" src="js/pages/login.js"></script>
</body>
</html>
